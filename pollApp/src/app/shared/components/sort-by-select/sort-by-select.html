<div class="sort-by">
  <button
    type="button"
    class="sort-by__trigger"
    [class.is-open]="open()"
    [class.has-chosen]="showChosen() && !!chosenLabel()"
    [class.is-invalid]="invalid()"
    (click)="toggle()"
  >
    <span>{{ label() }}</span>
    <app-icon class="sort-by__arrow" name="arrow-drop-down" />
  </button>

  @if (open()) {
    <ul class="sort-by__menu">
      @for (option of options(); track option.value) {
        <li>
          <button type="button" class="sort-by__option" (click)="select(option.value)">
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  } @else if (showChosen() && chosenLabel()) {
    <p class="sort-by__chosen">{{ chosenLabel() }}</p>
  }
</div>
