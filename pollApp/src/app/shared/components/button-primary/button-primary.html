<button
  class="btn-primary"
  [class.btn-primary--mobile-icon]="mobileIcon()"
  [class.btn-primary--check]="mobileIcon() === 'check'"
  [type]="type()"
  [disabled]="disabled()"
  (click)="clicked.emit()"
>
  <ng-content />
  <span class="btn-primary__icon">
    @if (mobileIcon() === 'check') {
      <app-icon name="check" />
    } @else {
      <app-icon name="add-circle" />
    }
  </span>
</button>
