@if (open()) {
  <div class="confirm-dialog__backdrop" (click)="cancelled.emit()">
    <div class="confirm-dialog" (click)="$event.stopPropagation()">
      <div class="confirm-dialog__header">
        <h3>{{ title() }}</h3>
        <app-close-icon-button (clicked)="cancelled.emit()" />
      </div>
      @if (message()) {
        <p class="confirm-dialog__message">{{ message() }}</p>
      }
      <div class="confirm-dialog__actions">
        <app-button-secondary (clicked)="cancelled.emit()">Cancel</app-button-secondary>
        <app-button-primary (clicked)="confirmed.emit()">{{ confirmLabel() }}</app-button-primary>
      </div>
    </div>
  </div>
}
