<div class="results-panel">
  <h3 class="results-panel__title">Survey results <span class="live-dot">LIVE</span></h3>

  @if (!hasResponses()) {
    <p class="results-panel__empty">There are no responses yet.</p>
  } @else {
    @for (question of questionViews(); track question.questionId) {
      <div class="results-question">
        <p class="results-question__text">{{ question.text }}</p>
        @for (option of question.options; track option.optionId) {
          <div class="result-bar">
            <div class="result-bar__label">
              <span>{{ option.text }}</span>
              <span>{{ option.percentage }}%</span>
            </div>
            <div class="result-bar__track">
              <div class="result-bar__fill" [style.width.%]="option.percentage"></div>
            </div>
          </div>
        }
      </div>
    }
  }
</div>
