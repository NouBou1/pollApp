<section class="create-survey">
  <app-create-survey-header (cancelled)="dialog.close()" />

  <form class="create-survey__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="create-survey__body">
      <div class="create-survey__column">
        <div class="field">
          <label class="field__label" for="survey-title">Survey name <span aria-hidden="true">*</span></label>
          <input id="survey-title" class="field__input" type="text" formControlName="title" />
          <app-close-icon-button class="field__clear" ariaLabel="Clear survey name" (clicked)="clear('title')" />
        </div>

        <div class="field-row">
          <div class="field field--date">
            <label class="field__label" for="survey-end-date">
              Set end date <span aria-hidden="true">*</span>
            </label>
            <input
              id="survey-end-date"
              class="field__input field__input--date"
              [class.is-empty]="!form.controls.endDate.value"
              type="date"
              [min]="minEndDate"
              formControlName="endDate"
            />
            <app-close-icon-button class="field__clear" ariaLabel="Clear end date" (clicked)="clear('endDate')" />
          </div>

          <app-sort-by-select
            class="field-row__category"
            label="Choose category *"
            [options]="categoryOptions"
            [value]="form.controls.category.value"
            [showChosen]="true"
            [invalid]="form.controls.category.invalid && form.controls.category.touched"
            (valueChange)="form.controls.category.setValue($event)"
          />
        </div>
      </div>

      <div class="create-survey__column">
        <div class="field field--top">
          <label class="field__label" for="survey-description">
            Describing text <span class="field__optional">(optional)</span>
          </label>
          <textarea
            id="survey-description"
            class="field__input field__input--textarea"
            formControlName="description"
          ></textarea>
          <app-close-icon-button
            class="field__clear"
            ariaLabel="Clear describing text"
            (clicked)="clear('description')"
          />
        </div>
      </div>

      @for (question of questions.controls; track question) {
        <app-question-form-group
          [question]="question"
          [index]="$index"
          [removable]="questions.length > 1"
          (removeQuestion)="removeQuestion($index)"
        />
      }

      <div class="create-survey__column create-survey__column--add">
        <button type="button" class="soft-button" (click)="addQuestion()">
          Add next question
          <app-icon name="add-circle" />
        </button>
      </div>
    </div>

    <div class="create-survey__footer">
      <app-button-primary type="submit" [disabled]="submitting()" mobileIcon="check">Publish</app-button-primary>
      <p class="create-survey__error" aria-live="polite">{{ validationMessage() ?? error() }}</p>
    </div>
  </form>
</section>

<app-toast [visible]="!!publishedSurveyId()" (closed)="openPublishedSurvey()">
  Your survey is now published
</app-toast>
