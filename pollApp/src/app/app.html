<header class="app-header">
  <a class="app-header__logo" routerLink="/home">
    <img
      class="app-header__logo-icon"
      [src]="isLight() ? '/assets/logo-dark.svg' : '/assets/logo.svg'"
      alt="PollApp"
    />
  </a>
  @if (showHeaderCta()) {
    <app-button-primary class="app-header__cta" routerLink="/create-survey">Create survey</app-button-primary>
  }
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <a class="app-footer__link" routerLink="/impressum">Impressum</a>
</footer>
