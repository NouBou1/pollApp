<header class="app-header">
  <a class="app-header__logo" routerLink="/home">
    <svg
      class="app-header__logo-icon"
      width="36"
      height="36"
      viewBox="0 0 36 36"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M6 4h24a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H14l-7 6v-6H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z"
        fill="var(--color-accent)"
      />
      <rect x="9" y="11" width="18" height="2.4" rx="1.2" fill="var(--color-accent-contrast)" />
      <rect x="9" y="16" width="13" height="2.4" rx="1.2" fill="var(--color-accent-contrast)" />
    </svg>
    <span class="app-header__logo-text">Poll<br />App</span>
  </a>
  <nav class="app-header__nav">
    <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      >Home</a
    >
    <a routerLink="/create-survey" routerLinkActive="is-active">Create Survey</a>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
